name: Build iOS app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*BitChord|\*\* BUILD" || true
          # The app's own binary and Info.plist must exist: a bundle holding only an
          # embedded framework means the Swift code failed to compile.
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/BitChord.app/BitChord
          test -f build/Build/Products/Release-iphoneos/BitChord.app/Info.plist

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -100

      - name: Check the app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/BitChord.app
          echo "App contents:"; ls -la "$APP"
          echo "Frameworks:"; ls -la "$APP/Frameworks" || true
          # Google Cast is a dynamic framework: if it isn't inside the app, the app can't launch.
          if [ ! -d "$APP/Frameworks/GoogleCast.framework" ]; then
            echo "GoogleCast.framework was not embedded; copying it in from the package build."
            FW=$(find build -path "*Release-iphoneos*" -name GoogleCast.framework -type d | grep -v "BitChord.app" | head -1)
            [ -z "$FW" ] && FW=$(find build/SourcePackages -path "*ios-arm64/GoogleCast.framework" -type d | head -1)
            echo "Found: $FW"
            mkdir -p "$APP/Frameworks"
            cp -R "$FW" "$APP/Frameworks/"
            rm -rf "$APP/Frameworks/GoogleCast.framework/Headers" "$APP/Frameworks/GoogleCast.framework/Modules"
          fi
          test -f "$APP/Frameworks/GoogleCast.framework/GoogleCast"
          test -f "$APP/BitChord" && test -f "$APP/Info.plist"
          otool -L "$APP/BitChord" | grep -i googlecast || true
          du -sh "$APP"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BitChord.app Payload/
          zip -qr BitChord.ipa Payload
          unzip -l BitChord.ipa | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-ipa
          path: BitChord.ipa
          retention-days: 30

      # Also publish the bare .ipa on the repo's Releases page, so it downloads
      # ready to drop into Sideloadly with no zip around it.
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" BitChord.ipa \
            --title "BitChord iOS build ${{ github.run_number }}" \
            --notes "Unsigned build of ${{ github.sha }}. Install with Sideloadly or AltStore." \
            --latest
