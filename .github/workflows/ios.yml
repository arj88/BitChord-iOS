name: Build iOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*BitChord|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/BitChord.app

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -100

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BitChord.app Payload/
          zip -qry BitChord.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-ipa
          path: BitChord.ipa
          retention-days: 30
