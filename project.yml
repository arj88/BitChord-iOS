name: BitChord
options:
  bundleIdPrefix: com.music
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    exactVersion: 4.8.6
targets:
  BitChord:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleCast
    sources:
      - path: BitChord
    info:
      path: BitChord/Info.plist
      properties:
        CFBundleDisplayName: FYT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSLocalNetworkUsageDescription: FYT looks for TVs and speakers on your Wi-Fi so you can cast music to them.
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.music.bitchord.links
            CFBundleURLSchemes: [bitchord]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.ios
        PRODUCT_NAME: BitChord
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  BitChord:
    build:
      targets:
        BitChord: all
    run:
      config: Debug
    archive:
      config: Release
